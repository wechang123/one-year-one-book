<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="'Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif" role="img" aria-label="한 장, 한 마디 아키텍처">
  <!-- 배경: 앱과 같은 종이색 -->
  <rect width="960" height="560" rx="12" fill="#faf7f1"/>
  <rect x="0.5" y="0.5" width="959" height="559" rx="12" fill="none" stroke="#d8d2c6"/>

  <!-- 제목 -->
  <text x="32" y="44" font-size="19" font-weight="700" fill="#1c1a17">아키텍처 — 한 컨테이너 쌍, 외부 의존 0</text>
  <text x="32" y="66" font-size="12.5" fill="#6b6558">docker compose up 하나로 아래 전부가 뜹니다 · 외부 API·CDN·웹폰트 호출 없음</text>

  <!-- ── 사용자 ── -->
  <g>
    <rect x="32" y="104" width="168" height="150" rx="10" fill="#ffffff" stroke="#d8d2c6"/>
    <text x="48" y="132" font-size="14" font-weight="700" fill="#1c1a17">사용자</text>
    <text x="48" y="158" font-size="12.5" fill="#3d3a33">폰 · 세로 · 한 손</text>
    <text x="48" y="176" font-size="11.5" fill="#6b6558">등록하는 30초</text>
    <line x1="48" y1="192" x2="184" y2="192" stroke="#eee8dc"/>
    <text x="48" y="214" font-size="12.5" fill="#3d3a33">노트북 · 1440px</text>
    <text x="48" y="232" font-size="11.5" fill="#6b6558">처음 열어보는 5분</text>
  </g>

  <!-- HTTP 화살표 -->
  <line x1="200" y1="176" x2="252" y2="176" stroke="#1c1a17" stroke-width="1.5"/>
  <path d="M252 176 l-8 -4.5 v9 z" fill="#1c1a17"/>
  <text x="204" y="166" font-size="11" fill="#6b6558">HTTP</text>

  <!-- ── Docker 경계 ── -->
  <rect x="252" y="88" width="676" height="392" rx="12" fill="none" stroke="#a89f8d" stroke-dasharray="6 5"/>
  <text x="268" y="112" font-size="11.5" letter-spacing="1" fill="#6b6558">DOCKER COMPOSE</text>

  <!-- ── Next 앱 ── -->
  <g>
    <rect x="276" y="128" width="332" height="326" rx="10" fill="#ffffff" stroke="#d8d2c6"/>
    <text x="294" y="156" font-size="14" font-weight="700" fill="#1c1a17">Next 16 앱 (컨테이너 1)</text>
    <text x="294" y="174" font-size="11.5" fill="#6b6558">화면과 서버가 한 몸 — 별도 API 서버 없음</text>

    <!-- 읽기 -->
    <rect x="294" y="190" width="296" height="70" rx="8" fill="#f2efe9" stroke="#e0dacc"/>
    <text x="308" y="212" font-size="12.5" font-weight="700" fill="#5b4b8a">서버 컴포넌트 — 읽기</text>
    <text x="308" y="230" font-size="11.5" fill="#3d3a33">모아보기(편지 구) · 타임라인 · 캘린더</text>
    <text x="308" y="246" font-size="11.5" fill="#3d3a33">되짚어보기 · 책 — 18화면 전부 서버 렌더</text>

    <!-- 쓰기 -->
    <rect x="294" y="270" width="296" height="70" rx="8" fill="#f2efe9" stroke="#e0dacc"/>
    <text x="308" y="292" font-size="12.5" font-weight="700" fill="#1e6f66">서버 액션 — 쓰기</text>
    <text x="308" y="310" font-size="11.5" fill="#3d3a33">등록 · 편지 더하기/고치기/지우기 · 만든 날</text>
    <text x="308" y="326" font-size="11.5" fill="#3d3a33">책 만들기 · 주문 · 상태 전진 · 데모 초기화</text>

    <!-- 사진 -->
    <rect x="294" y="350" width="296" height="52" rx="8" fill="#f2efe9" stroke="#e0dacc"/>
    <text x="308" y="372" font-size="12.5" font-weight="700" fill="#8a6212">route handler — 사진</text>
    <text x="308" y="390" font-size="11.5" fill="#3d3a33">/api/photo/[id] · DB Bytes → 이미지 응답 · immutable</text>

    <text x="294" y="432" font-size="11" fill="#6b6558">lib/ — 시간 축(age) · 편지 규칙(letter) · 구 투영(sphere)</text>
    <text x="294" y="447" font-size="11" fill="#6b6558">클라이언트 JS는 구 회전·줌, 폼 상태 등 최소한만</text>
  </g>

  <!-- Prisma 화살표 -->
  <line x1="608" y1="240" x2="668" y2="240" stroke="#1c1a17" stroke-width="1.5"/>
  <path d="M668 240 l-8 -4.5 v9 z" fill="#1c1a17"/>
  <line x1="668" y1="300" x2="608" y2="300" stroke="#1c1a17" stroke-width="1.5"/>
  <path d="M608 300 l8 -4.5 v9 z" fill="#1c1a17"/>
  <text x="612" y="228" font-size="11" fill="#6b6558">Prisma 7</text>
  <text x="612" y="322" font-size="11" fill="#6b6558">adapter-pg</text>

  <!-- ── PostgreSQL ── -->
  <g>
    <rect x="668" y="128" width="236" height="326" rx="10" fill="#ffffff" stroke="#d8d2c6"/>
    <text x="686" y="156" font-size="14" font-weight="700" fill="#1c1a17">PostgreSQL (컨테이너 2)</text>
    <text x="686" y="174" font-size="11.5" fill="#6b6558">규칙이 제약으로 새겨진 곳</text>

    <rect x="686" y="190" width="200" height="118" rx="8" fill="#f2efe9" stroke="#e0dacc"/>
    <text x="700" y="211" font-size="12" font-weight="700" fill="#1c1a17">기록</text>
    <text x="700" y="230" font-size="11.5" fill="#3d3a33">Profile — 이름 · 예정일 · 생일</text>
    <text x="700" y="248" font-size="11.5" fill="#3d3a33">Artwork — 만든 날 (1:N ↓)</text>
    <text x="700" y="266" font-size="11.5" fill="#3d3a33">Letter — 말 · 쓴 사람 · 쓴 날</text>
    <text x="700" y="284" font-size="11.5" fill="#3d3a33">Photo — 사진 바이트 (1:1)</text>

    <rect x="686" y="318" width="200" height="100" rx="8" fill="#f2efe9" stroke="#e0dacc"/>
    <text x="700" y="339" font-size="12" font-weight="700" fill="#1c1a17">책과 주문</text>
    <text x="700" y="358" font-size="11.5" fill="#3d3a33">Collection — 연도 · 제목</text>
    <text x="700" y="376" font-size="11.5" fill="#3d3a33">Order — 상태 · 중복 방지 키</text>
    <text x="700" y="394" font-size="11.5" fill="#3d3a33">OrderEvent — 언제부터 그 상태</text>

    <text x="686" y="438" font-size="11" fill="#6b6558">한 해 한 권 = @@unique([profileId, year])</text>
  </g>

  <!-- 바닥 주석 -->
  <text x="268" y="500" font-size="11.5" fill="#6b6558">기동 시: 마이그레이션 적용 → 시드 12장 (멱등 · 이미지는 저장소 안의 코드가 생성)</text>
  <text x="32" y="536" font-size="11" fill="#a89f8d">이 그림도 저장소가 직접 그렸습니다 — docs/images/architecture.svg (손으로 쓴 SVG, 외부 도구 없음)</text>
</svg>

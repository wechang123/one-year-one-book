<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="한 장, 한 마디">
  <!--
    파비콘 — 책상 위에 놓인 두 장.

    🔑 이 저장소의 시드 이미지가 하나같이 "책상 위에 놓인 종이"를 그린다
      (scripts/seed-images.mjs의 sheet()). 파비콘도 같은 것을 그린다 —
      뒤에 한 장, 앞에 한 장. 낱장이 쌓여 한 권이 된다는 것이 이 서비스의 전부다.

    🔑 16px에서 읽히는 것만 넣었다. 글자도, 가는 선도 없다.
      뒤 장에만 색을 준 것은 그 색이 화면에서 뜻을 가진 색이기 때문이다
      (globals.css의 t-child, 만 N세 구간). 앞 장은 종이색이다.

    ⛔ 글자를 넣지 않는다. 실명처럼 보이는 것을 만들지 않는다는 규칙이 여기에도 걸린다.

    🔴 이 주석에 CSS 변수 이름을 그대로 적었다가 파비콘이 통째로 깨졌다.
      XML 주석 안에는 붙임표 두 개를 연달아 쓸 수 없다. 변수 이름이 그 모양이라
      파일이 XML로서 무효가 됐고, 브라우저는 오류 없이 깨진 이미지만 보여준다.
  -->
  <rect width="32" height="32" rx="7" fill="#1c1a17" />
  <rect x="9" y="8" width="13" height="17" rx="1.5" fill="#8a6212" transform="rotate(-9 15.5 16.5)" />
  <rect x="11" y="7" width="13" height="18" rx="1.5" fill="#faf8f4" transform="rotate(5 17.5 16)" />
</svg>

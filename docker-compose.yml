# 폴더 이름과 무관하게 프로젝트 이름을 고정한다.
name: kid-archive

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: kidarchive
      POSTGRES_PASSWORD: kidarchive
      POSTGRES_DB: kidarchive
      TZ: Asia/Seoul
    ports:
      # 5432 대신 5433 — 심사자 PC에 이미 도는 Postgres와 부딪히지 않게
      - "${DB_PORT:-5433}:5432"
    volumes:
      # postgres:18부터는 /data가 아니라 상위 디렉터리를 통째로 마운트한다.
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kidarchive -d kidarchive"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

  app:
    build: .
    environment:
      DATABASE_URL: postgresql://kidarchive:kidarchive@db:5432/kidarchive?schema=public
      TZ: Asia/Seoul
      NODE_ENV: production
    ports:
      - "${PORT:-3000}:3000"
    depends_on:
      db:
        # 포트가 열린 것만으로는 부족하다. 헬스체크 통과까지 기다린다.
        condition: service_healthy

volumes:
  db-data:
